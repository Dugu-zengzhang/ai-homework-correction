[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

markers =
    unit: 单元测试（纯函数/纯算法，不依赖外部服务）
    integration: 集成测试（Flask API / 数据库 / RAG 有状态）
    e2e: 端到端测试（完整业务链路）
    slow: 运行时间较长的测试（如真实 LLM 调用）
    require_llm: 需要真实 DeepSeek API Key 才能运行
    require_ocr: 需要本地 pytesseract + Tesseract 引擎才能运行
